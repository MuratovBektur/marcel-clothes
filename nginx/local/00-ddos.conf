# Локальная разработка — этот nginx никогда не смотрит в интернет (порт 7024
# доступен только на машине разработчика), защита от DDoS тут не нужна и
# только мешает: Nuxt dev-сервер (npm run dev) на каждую загрузку страницы
# шлёт десятки отдельных запросов JS-модулей (HMR/Vite, без бандлинга) —
# лимиты, скопированные из prod (rate=20r/s, burst=60), моментально дают 429
# на entry.js и ломают гидратацию Vue целиком (ни один клик на сайте не
# работает). В nginx/prod и nginx/dev (там клиент собран в prod-режиме,
# npm run start) лимиты оставлены как есть — трогать их не нужно.

# Защита от slowloris и слишком больших заголовков — не мешает обычной
# разработке, оставляем.
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
large_client_header_buffers 4 8k;
