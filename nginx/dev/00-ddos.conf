# Защита от DDoS/brute-force на уровне nginx.
# Файл лежит в conf.d/ и подключается через `include /etc/nginx/conf.d/*.conf;`
# внутри http-контекста базового /etc/nginx/nginx.conf образа nginx:latest.

# В dev-окружении порт 80 публикуется напрямую на хост (7011:80),
# gateway перед nginx нет — $remote_addr уже является реальным IP клиента.

# Зона лимита частоты запросов на весь сайт (статика, страницы)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
# Отдельная, более строгая зона для API/WS — обработка там дороже
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Отдельная, более мягкая зона для картинок (/uploads/) — статика с низким
# риском, на карточке товара может параллельно грузиться много изображений
limit_req_zone $binary_remote_addr zone=images_limit:10m rate=40r/s;

# Зона лимита числа одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Защита от slowloris и слишком больших заголовков
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
large_client_header_buffers 4 8k;
