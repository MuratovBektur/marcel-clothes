# Защита от DDoS/brute-force на уровне nginx.
# Файл лежит в conf.d/ и подключается через `include /etc/nginx/conf.d/*.conf;`
# внутри http-контекста базового /etc/nginx/nginx.conf образа nginx:latest.

# nginx стоит за docker-gateway (терминирует TLS) внутри gateway_network,
# поэтому $remote_addr здесь — это IP шлюза, а не реального клиента.
# Доверяем X-Forwarded-For от него, иначе лимиты ниже будут считаться
# суммарно по всем посетителям сайта сразу, а не по каждому IP отдельно.
# gateway_network — внутренняя docker-сеть, доступная только контейнерам
# на этом хосте, поэтому доверие приватным диапазонам безопасно.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Зона лимита частоты запросов на весь сайт (статика, страницы)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
# Отдельная, более строгая зона для API/WS — обработка там дороже
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Отдельная, более мягкая зона для картинок (/uploads/) — статика с низким
# риском, на карточке товара может параллельно грузиться много изображений
limit_req_zone $binary_remote_addr zone=images_limit:10m rate=40r/s;

# Зона лимита числа одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Защита от slowloris и слишком больших заголовков
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
large_client_header_buffers 4 8k;
