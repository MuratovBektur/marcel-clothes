name: marcel-clothes_prod

services:

  client:
    container_name: "marcel-clothes_client_prod"
    build:
      context: client
      dockerfile: Dockerfile
    expose:
      - 3000
    environment:
      - NODE_ENV=production
    command: sh -c "node scripts/generate-sitemap.mjs --watch & npm run start"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./client:/app
      - /app/node_modules

  server:
    container_name: "marcel-clothes_server_prod"
    restart: always
    depends_on:
      - telegram-bot-api
    build: server
    expose:
      - 5000
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
    command: npm run start:prod
    volumes:
      - ./uploads:/app/uploads
      - tg_bot_api_data_prod:/var/lib/telegram-bot-api:ro

  # Свой Telegram Bot API сервер — снимает лимит облачного api.telegram.org
  # в 20 МБ на getFile (до 2000 МБ). Требует TELEGRAM_API_ID/TELEGRAM_API_HASH
  # (с https://my.telegram.org/apps) и TELEGRAM_BOT_API_ROOT=http://telegram-bot-api:8081
  # в .env — см. .env.example. --local: пишет файлы на диск (общий том ниже)
  # вместо отдачи по HTTP — server читает их напрямую (root в этом
  # контейнере, доступ к чужим файлам не проблема).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: "marcel-clothes_telegram-bot-api_prod"
    restart: always
    environment:
      - TELEGRAM_LOCAL=1
    env_file:
      - .env
    expose:
      - 8081
    volumes:
      - tg_bot_api_data_prod:/var/lib/telegram-bot-api

  nginx:
    image: nginx
    restart: unless-stopped
    container_name: "marcel-clothes_nginx_prod"
    # ports убраны — шлюз занимает 80/443
    expose:
      - "80"
    depends_on:
      - client
      - server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./client:/usr/share/nginx/html
      - ./nginx/prod:/etc/nginx/conf.d
      - ./uploads:/usr/share/nginx/uploads
    networks:
      - gateway_network
      - default

  # certbot убран — сертификатами управляет docker-gateway

networks:
  gateway_network:
    external: true
  default:
    driver: bridge

volumes:
  tg_bot_api_data_prod:
