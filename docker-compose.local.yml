name: marcel-clothes_local

services:

  client:
    container_name: "marcel-clothes_client_local"
    build:
      context: client
      dockerfile: Dockerfile_local
    expose:
      - 3000
    environment:
      - NODE_ENV=development
    command: sh -c "node scripts/generate-sitemap.mjs --watch & npm run dev"
   
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./client:/app
      - /app/node_modules

  server:
    container_name: "marcel-clothes_server_local"
    user: "${UID:-1000}:${GID:-1000}"
    # gid 101 = "telegram-bot-api" user in aiogram/telegram-bot-api image — нужен,
    # чтобы читать файлы из общего тома tg_bot_api_data_local (см. ниже, --local режим).
    group_add:
      - "101"
    restart: always
    depends_on:
      - telegram-bot-api
    build:
      context: server
      dockerfile: Dockerfile_local
    env_file:
      - ./.env.local
    expose:
      - 5000
    environment:
      - NODE_ENV=development
    command: npm run start:dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./server:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - tg_bot_api_data_local:/var/lib/telegram-bot-api:ro
      - ./tunnel:/tunnel:ro
  nginx:
    image: nginx
    restart: "no"
    container_name: "marcel-clothes_nginx_local"
    ports:
      - 7024:80
    depends_on:
      - client
      - server
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/local:/etc/nginx/conf.d
      - ./uploads:/usr/share/nginx/uploads

  # Свой Telegram Bot API сервер — снимает лимит облачного api.telegram.org
  # в 20 МБ на getFile (до 2000 МБ). Требует api_id/api_hash с
  # https://my.telegram.org/apps (TELEGRAM_API_ID, TELEGRAM_API_HASH в
  # .env.local — см. .env.example) и TELEGRAM_BOT_API_ROOT там же.
  # --local: без него getFile для файлов >20 МБ всё равно падает с "file is
  # too big" (сам HTTP-релей отдаёт файлы только до 20 МБ) — --local вместо
  # этого пишет полученные файлы на диск в volume ниже, а сервер (file-storage
  # .service.ts) читает их оттуда напрямую вместо скачивания по HTTP.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: "marcel-clothes_telegram-bot-api_local"
    restart: always
    environment:
      - TELEGRAM_LOCAL=1
    env_file:
      - ./.env.local
    expose:
      - 8081
    volumes:
      - tg_bot_api_data_local:/var/lib/telegram-bot-api

  # Автоматический Cloudflare Quick Tunnel на nginx — даёт публичный URL,
  # без которого Instagram/Facebook/глобальный маркет не могут скачать
  # фото/видео товара (им нужен реальный интернет-адрес, localhost не подойдёт).
  # Бесплатный анонимный режим (без аккаунта Cloudflare) — при каждом
  # перезапуске адрес НОВЫЙ, это ограничение самого Cloudflare, не наше. Но
  # адрес подхватывается автоматически: quick-tunnel.sh пишет его в общий том
  # ./tunnel, а server читает оттуда при каждой публикации
  # (server/src/libs/public-url.ts) — руками .env.local больше не правим.
  # Официальный образ cloudflared без шелла — поэтому свой Dockerfile
  # (просто копирует бинарник в alpine, где есть sh/grep для скрипта).
  cloudflared:
    build: ./cloudflared
    container_name: "marcel-clothes_cloudflared_local"
    restart: always
    depends_on:
      - nginx
    environment:
      - TUNNEL_TARGET_URL=http://nginx:80
    volumes:
      - ./tunnel:/tunnel

volumes:
  tg_bot_api_data_local: