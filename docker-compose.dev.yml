name: marcel-clothes_dev

services:

  client:
    container_name: "marcel-clothes_client_dev"
    build:
      context: client
      dockerfile: Dockerfile
    expose:
      - 3000
    environment:
      - NODE_ENV=production
    command: sh -c "node scripts/generate-sitemap.mjs --watch & npm run start"

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./client:/app
      - /app/node_modules


  server:
    container_name: "marcel-clothes_server_dev"
    restart: always
    depends_on:
      - telegram-bot-api
    build: server
    expose:
      - 5000
    env_file:
      - ./.env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
    command: npm run start:prod
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - tg_bot_api_data_dev:/var/lib/telegram-bot-api:ro

  # Свой Telegram Bot API сервер — снимает лимит облачного api.telegram.org
  # в 20 МБ на getFile (до 2000 МБ). Требует TELEGRAM_API_ID/TELEGRAM_API_HASH
  # (с https://my.telegram.org/apps) и TELEGRAM_BOT_API_ROOT=http://telegram-bot-api:8081
  # в .env.dev — см. .env.example. --local: пишет файлы на диск (общий том
  # ниже) вместо отдачи по HTTP — server читает их напрямую (root в этом
  # контейнере, доступ к чужим файлам не проблема, в отличие от локалки).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: "marcel-clothes_telegram-bot-api_dev"
    restart: always
    environment:
      - TELEGRAM_LOCAL=1
    env_file:
      - ./.env.dev
    expose:
      - 8081
    volumes:
      - tg_bot_api_data_dev:/var/lib/telegram-bot-api

  nginx:
    image: nginx
    restart: "no"
    container_name: "marcel-clothes_nginx_dev"
    ports:
      - 7011:80
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/dev:/etc/nginx/conf.d
      - ./client:/usr/share/nginx/html
      - ./uploads:/usr/share/nginx/uploads
    depends_on:
      - server
      - client
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tg_bot_api_data_dev: